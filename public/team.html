<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>window.location.replace('feed.html');</script>
<link rel="stylesheet" href="timsy.css">
</head>

<!-- TIMSY BOT -->


<!-- TIMSY BOT -->
<div id="timsy-launcher" onclick="toggleTimsy()">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
<div style="position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:#34C759;border-radius:50%;border:2px solid #000;"></div>
</div>
<div id="timsy-chat">
<div style="background:linear-gradient(135deg,#c8102e,#a00d24);padding:16px 20px;display:flex;align-items:center;gap:12px;">
<div style="width:40px;height:40px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;">&#9749;</div>
<div style="flex:1;"><div style="font-weight:800;font-size:1em;color:#fff;">Timsy</div><div style="font-size:0.7em;color:rgba(255,255,255,0.7);">Ops Assistant &#8226; Online</div></div>
<div id="timsy-voice-btn" onclick="toggleVoice()" style="cursor:pointer;color:rgba(255,255,255,0.7);font-size:0.7em;padding:4px 8px;border:1px solid rgba(255,255,255,0.3);border-radius:12px;" title="Toggle voice">&#128266;</div>
<div class="timsy-close-btn" onclick="toggleTimsy()">&#10005;</div>
</div>
<div id="timsy-messages">
<div style="display:flex;gap:8px;align-items:flex-start;">
<div style="width:28px;height:28px;background:#c8102e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;">&#9749;</div>
<div style="background:#1a1a1a;border:1px solid #333;border-radius:16px;border-top-left-radius:4px;padding:12px 16px;font-size:0.85em;line-height:1.5;color:#ddd;max-width:85%;">Hey there! I am <b style="color:#c8102e;">Timsy</b>, your ops assistant. Ask me about stores, ratings, FDU compliance, donuts, tasks, or anything on OpsAIHub!</div>
</div>
</div>
<div style="padding:12px 16px;border-top:1px solid #222;display:flex;gap:10px;align-items:center;">
<input id="timsy-input" type="text" placeholder="Ask Timsy..." onkeydown="if(event.key==='Enter')sendTimsy()">
<div onclick="sendTimsy()" style="width:38px;height:38px;background:#c8102e;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></div>
</div>
</div>

<script>
var timsyOpen = false;
var voiceEnabled = false;
function toggleTimsy() {
  timsyOpen = !timsyOpen;
  document.getElementById("timsy-chat").style.display = timsyOpen ? "flex" : "none";
  if (timsyOpen) document.getElementById("timsy-input").focus();
}
function toggleVoice() {
  voiceEnabled = !voiceEnabled;
  var b = document.getElementById("timsy-voice-btn");
  if (voiceEnabled) {
    b.style.background = "#c8102e";
    b.style.color = "#fff";
    b.textContent = "ON";
  } else {
    b.style.background = "transparent";
    b.style.color = "rgba(255,255,255,0.7)";
    b.textContent = "\uD83D\uDD0A";
    window.speechSynthesis.cancel();
  }
}
function addTimsyMsg(text, isBot) {
  var m = document.getElementById("timsy-messages");
  var w = document.createElement("div");
  w.style.display = "flex";
  w.style.gap = "8px";
  w.style.alignItems = "flex-start";
  w.style.flexDirection = isBot ? "row" : "row-reverse";
  var f = text.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
  var avatar = '<div style="width:28px;height:28px;background:#c8102e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;">\u2615</div>';
  var botBubble = '<div style="background:#1a1a1a;border:1px solid #333;border-radius:16px;border-top-left-radius:4px;padding:12px 16px;font-size:0.85em;line-height:1.5;color:#ddd;max-width:85%;">' + f + '</div>';
  var userBubble = '<div style="background:#c8102e;border-radius:16px;border-top-right-radius:4px;padding:12px 16px;font-size:0.85em;line-height:1.5;color:#fff;max-width:85%;">' + f + '</div>';
  w.innerHTML = isBot ? avatar + botBubble : userBubble;
  m.appendChild(w);
  m.scrollTop = m.scrollHeight;
}
function addTyping() {
  var m = document.getElementById("timsy-messages");
  var w = document.createElement("div");
  w.id = "timsy-typing";
  w.style.display = "flex";
  w.style.gap = "8px";
  w.innerHTML = '<div style="width:28px;height:28px;background:#c8102e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;">\u2615</div><div style="background:#1a1a1a;border:1px solid #333;border-radius:16px;border-top-left-radius:4px;padding:12px 16px;">Typing...</div>';
  m.appendChild(w);
  m.scrollTop = m.scrollHeight;
}
function removeTyping() {
  var e = document.getElementById("timsy-typing");
  if (e) e.remove();
}
async function sendTimsy() {
  var i = document.getElementById("timsy-input");
  var q = i.value.trim();
  if (!q) return;
  addTimsyMsg(q, false);
  i.value = "";
  addTyping();
  try {
    var r = await fetch("/timsy_api.php", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({q: q})
    });
    var d = await r.json();
    removeTyping();
    addTimsyMsg(d.reply, true);
    if (voiceEnabled) {
      var p = d.reply.replace(/<[^>]*>/g, "").replace(/\*\*/g, "").replace(/\n+/g, ". ").trim();
      var u = new SpeechSynthesisUtterance(p);
      u.rate = 1;
      u.pitch = 1;
      window.speechSynthesis.speak(u);
    }
  } catch(e) {
    removeTyping();
    addTimsyMsg("Sorry, I hit a snag. Try again!", true);
  }
}
</script>
</html>
