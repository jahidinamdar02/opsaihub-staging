<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1.0">
<title>Audit Intelligence</title>
<style>
:root{--red:#C8102E;--surface:#F2F2F7;--card:#fff;--border:#E5E5EA;--text:#1C1C1E;--text2:#8E8E93;--green:#34C759;--amber:#FF9500;--fail:#FF3B30;--blue:#007AFF;--nav-h:72px;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--surface);padding-bottom:calc(var(--nav-h)+16px);}
.hdr{background:linear-gradient(160deg,#0A1628,#0D2137,#0A1628);padding:calc(env(safe-area-inset-top,0px)+44px) 18px 18px;position:relative;}
.hdr-eye{font-size:10px;font-weight:700;color:#007AFF;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px;}
.hdr-ttl{font-size:26px;font-weight:700;color:#fff;letter-spacing:-0.5px;}
.hdr-sub{font-size:12px;color:rgba(255,255,255,0.5);margin-top:4px;}
.cycle-toggle{display:flex;gap:0;background:rgba(255,255,255,0.1);border-radius:12px;padding:3px;margin:14px 0 0;}
.cyc-btn{flex:1;padding:8px;border-radius:9px;border:none;background:transparent;font-size:13px;font-weight:600;color:rgba(255,255,255,0.5);cursor:pointer;}
.cyc-btn.active{background:#007AFF;color:#fff;}
.content{padding:12px 16px;}
.tog-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;}
.tog-row::-webkit-scrollbar{display:none;}
.tog-btn{flex-shrink:0;padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;}
.tog-btn.active{background:#007AFF;color:#fff;border-color:#007AFF;}
.india-kpi{background:linear-gradient(135deg,#0D0D1A,#1A0508);border-radius:16px;padding:16px;margin-bottom:12px;}
.kpi-label{font-size:10px;font-weight:700;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.kpi-box{background:rgba(255,255,255,0.06);border-radius:12px;padding:12px;text-align:center;}
.kpi-val{font-size:30px;font-weight:700;}
.kpi-lbl{font-size:9px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.5px;margin-top:3px;}
.kpi-breakdown{background:rgba(255,255,255,0.06);border-radius:12px;padding:12px;}
.kpi-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:11px;}
.kpi-row:last-child{border-bottom:none;}
.kpi-row-lbl{color:rgba(255,255,255,0.5);}
.prog-wrap{position:relative;height:8px;background:rgba(255,255,255,0.08);border-radius:4px;margin:10px 0 5px;}
.prog-bar{height:100%;border-radius:4px;}
.prog-marker{position:absolute;top:-4px;width:2px;height:16px;background:rgba(255,255,255,0.5);border-radius:1px;}
.prog-foot{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,0.35);}
.am-kpi{background:linear-gradient(135deg,#0D0D1A,#12121F);border-radius:16px;padding:16px;margin-bottom:12px;}
.am-kpi-row{padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
.am-kpi-row:last-child{border-bottom:none;}
.am-kpi-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px;}
.am-kpi-name{font-size:13px;font-weight:700;color:#fff;}
.am-kpi-region{font-size:10px;color:rgba(255,255,255,0.35);margin-top:1px;}
.am-kpi-score{font-size:18px;font-weight:700;}
.am-kpi-band{font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;margin-top:2px;display:inline-block;}
.am-bar-bg{height:4px;background:rgba(255,255,255,0.08);border-radius:2px;margin-bottom:4px;}
.am-bar-fill{height:100%;border-radius:2px;}
.am-kpi-foot{font-size:10px;color:rgba(255,255,255,0.35);}
.sec-lbl{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;margin:14px 0 8px;}
.am-section{margin-bottom:14px;}
.am-hdr{background:var(--text);border-radius:12px 12px 0 0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;}
.am-hdr-name{font-size:13px;font-weight:700;color:#fff;}
.am-hdr-avg{font-size:12px;font-weight:700;}
.store-row{background:var(--card);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;}
.store-row:last-child{border-bottom:none;border-radius:0 0 12px 12px;}
.store-name{flex:1;font-size:13px;font-weight:600;color:var(--text);}
.fs-pill{padding:3px 7px;border-radius:6px;font-size:10px;font-weight:700;}
.fs-pass{background:rgba(52,199,89,0.12);color:#1B7A3A;}
.fs-fail{background:rgba(255,59,48,0.12);color:#C8102E;}
.fs-pend{background:rgba(142,142,147,0.1);color:#8E8E93;}
.sub-table{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06);margin-bottom:14px;}
.sub-row{display:flex;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border);gap:8px;}
.sub-row:last-child{border-bottom:none;}
.sub-hdr-row{background:#1C1C1E;padding:7px 12px;}
.sub-hc{font-size:9px;font-weight:700;color:rgba(255,255,255,0.55);text-transform:uppercase;}
.entry-form{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.form-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:14px;}
.form-row{margin-bottom:12px;}
.form-lbl{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
.form-input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);font-size:14px;font-family:inherit;color:var(--text);background:var(--surface);}
.form-input:focus{outline:none;border-color:#007AFF;}
.fs-toggle{display:flex;gap:8px;}
.fs-opt{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;text-align:center;}
.fs-opt.pass-sel{background:rgba(52,199,89,0.15);border-color:var(--green);color:#1B7A3A;}
.fs-opt.fail-sel{background:rgba(255,59,48,0.12);border-color:var(--fail);color:var(--fail);}
.audit-type-row{display:flex;gap:8px;}
.type-opt{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;text-align:center;}
.type-opt.selected{background:#007AFF;color:#fff;border-color:#007AFF;}
.submit-btn{width:100%;padding:14px;border-radius:12px;border:none;background:#007AFF;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px;}
.empty{text-align:center;padding:24px;color:var(--text2);font-size:13px;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);z-index:1000;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;padding:6px 8px;min-width:50px;}
.nav-icon{font-size:20px;}
.nav-label{font-size:9px;font-weight:500;color:var(--text2);}
.nav-item.active .nav-label{color:#007AFF;font-weight:700;}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-eye">Quality Assurance</div>
  <div class="hdr-ttl">Audit Intelligence</div>
  <div class="hdr-sub" id="hodDate">REV &amp; Food Safety &mdash; 44 stores &middot; 2026</div>
  <div class="cycle-toggle">
    <button class="cyc-btn active" onclick="setCycle('H1')">H1 2026 &middot; Jan-Jun</button>
    <button class="cyc-btn" onclick="setCycle('H2')">H2 2026 &middot; Jul-Dec</button>
  </div>
</div>
<div class="content">
  <div class="tog-row">
    <button class="tog-btn active" onclick="sv('overview')">Overview</button>
    <button class="tog-btn" onclick="sv('byam')">By AM</button>
    <button class="tog-btn" onclick="sv('submissions')">All Scores</button>
    <button class="tog-btn" onclick="sv('entry')">+ Entry</button>
  </div>
  <div id="v-overview"></div>
  <div id="v-byam" style="display:none"></div>
  <div id="v-submissions" style="display:none"></div>
  <div id="v-entry" style="display:none"></div>
</div>
<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><span class="nav-icon">&#127968;</span><span class="nav-label">Home</span></a>
  <a href="tasks.html" class="nav-item"><span class="nav-icon">&#9989;</span><span class="nav-label">Tasks</span></a>
  <a href="events.html" class="nav-item"><span class="nav-icon">&#128197;</span><span class="nav-label">Events</span></a>
  <a href="performance.html" class="nav-item"><span class="nav-icon">&#128202;</span><span class="nav-label">Scores</span></a>
  <a href="team.html" class="nav-item"><span class="nav-icon">&#128101;</span><span class="nav-label">Team</span></a>
  <a href="audit.html" class="nav-item active"><span class="nav-icon">&#128269;</span><span class="nav-label">Audits</span></a>
</nav>
<script>
var CC='H1', AD={audits:[]}, CAM=localStorage.getItem('th_am_name')||'', FSS='', ATS='rev_fs';
var AMS={
  Raman:['TH T3D DIAL','TH T3D Food Court','TH T1D Dial'],
  Harish:['TH DLF Cyberhub','TH Golf Course AIPL','TH Select City Saket','TH Green Park','TH Basant Lok','TH Epicuria Nehru Place'],
  Rohit:['TH Skymark one','TH Vegas Mall','TH NSP Pritampura','TH Punjabi bagh'],
  Deepak:['TH Malhar Road','TH Sunview Enclave','TH Bucho Bathinda','TH Patiala','TH Mohali','TH Sangrur','TH Elante Mall','TH Sec 35 Chandigarh'],
  'Akash Chavan':['TH Balewadi Pune','TH Lokhandwala','TH MC Kurla','TH Viman Nagar','TH Phonix Mall Wakad','TH FC Road','TH FIFC Mumbai'],
  'Akash Rathod':['TH HPCL Mumbai Pune Expressway','TH NMIA Arrival','TH NMiA Departure','TH Nexus Seawood'],
  Jagadeesha:['TH Koramangala','TH BIAL','TH Mall of Asia','TH HSR'],
  Shivam:['TH Inorbit Mall-Hyderabad','TH HIAL','TH HIAL Arrival','TH Lakeshore']
};
var AMR={Raman:'Delhi NCR',Harish:'Delhi NCR',Rohit:'Delhi NCR',Deepak:'Punjab','Akash Chavan':'Maharashtra','Akash Rathod':'Maharashtra',Jagadeesha:'Karnataka',Shivam:'Telangana'};

function rc(s){return s>=86?'#34C759':s>=77?'#FF9500':'#FF3B30';}
function rb(s){return s>=86?'Excellent':s>=77?'Pass':'FAIL';}
function rbg(s){return s>=86?'rgba(52,199,89,0.15)':s>=77?'rgba(255,149,0,0.15)':'rgba(255,59,48,0.12)';}
function sd(s){return s.replace('TH ','');}
function ga(store){
  return (AD.audits||[]).filter(function(a){return a.store===store&&a.cycle===CC;})
    .sort(function(a,b){return new Date(b.submittedAt)-new Date(a.submittedAt);})[0]||null;
}

function sv(v){
  ['overview','byam','submissions','entry'].forEach(function(id){
    document.getElementById('v-'+id).style.display=id===v?'block':'none';
  });
  document.querySelectorAll('.tog-btn').forEach(function(b,i){
    b.classList.toggle('active',['overview','byam','submissions','entry'][i]===v);
  });
  if(v==='entry') renderEntry();
}

function setCycle(c){
  CC=c;
  document.querySelectorAll('.cyc-btn').forEach(function(b,i){b.classList.toggle('active',['H1','H2'][i]===c);});
  renderAll();
}

function load(){
  fetch('/api/audits').then(function(r){return r.json();}).then(function(d){
    AD=d.data||{audits:[]};
    if(!AD.audits) AD.audits=[];
    renderAll();
  }).catch(function(){AD={audits:[]};renderAll();});
}

function renderAll(){
  renderOverview();
  renderByAM();
  renderSubmissions();
}

function renderOverview(){
  var ra=(AD.audits||[]).filter(function(a){return a.cycle===CC&&a.rev_score!==null&&a.rev_score!==undefined;});
  var fa=(AD.audits||[]).filter(function(a){return a.cycle===CC&&a.fs_result;});
  var html='';

  if(!ra.length){
    html='<div class="india-kpi"><div class="kpi-label">India REV Average &mdash; '+CC+' 2026</div>';
    html+='<div class="empty" style="color:rgba(255,255,255,0.4);">No REV scores entered yet</div></div>';
  } else {
    var avg=Math.round(ra.reduce(function(t,a){return t+a.rev_score;},0)/ra.length*10)/10;
    var passed=ra.filter(function(a){return a.rev_score>=77;}).length;
    var excellent=ra.filter(function(a){return a.rev_score>=86;}).length;
    var borderline=passed-excellent;
    var failed=ra.filter(function(a){return a.rev_score<77;}).length;
    var fsPassed=fa.filter(function(a){return a.fs_result==='pass';}).length;
    var ac=rc(avg);
    var gap=avg>=86?'Above target':'Gap: '+(86-avg).toFixed(1)+'% to target';

    html='<div class="india-kpi">';
    html+='<div class="kpi-label">India REV Average &mdash; '+CC+' 2026 &mdash; Target: 86%+</div>';
    html+='<div class="kpi-grid">';
    html+='<div class="kpi-box"><div class="kpi-val" style="color:'+ac+';">'+avg+'%</div>';
    html+='<div class="kpi-lbl">India REV Avg</div>';
    html+='<div style="display:inline-block;margin-top:5px;padding:2px 10px;border-radius:6px;font-size:10px;font-weight:700;background:'+rbg(avg)+';color:'+ac+';">'+rb(avg)+'</div></div>';
    html+='<div class="kpi-breakdown">';
    html+='<div class="kpi-row"><span class="kpi-row-lbl">86%+ Excellent</span><span style="font-weight:700;color:#34C759;">'+excellent+'</span></div>';
    html+='<div class="kpi-row"><span class="kpi-row-lbl">77-85% Pass</span><span style="font-weight:700;color:#FF9500;">'+borderline+'</span></div>';
    html+='<div class="kpi-row"><span class="kpi-row-lbl">Below 77% FAIL</span><span style="font-weight:700;color:#FF3B30;">'+failed+'</span></div>';
    html+='<div class="kpi-row"><span class="kpi-row-lbl">FS Pass rate</span><span style="font-weight:700;color:#34C759;">'+(fa.length?fsPassed+'/'+fa.length:'--')+'</span></div></div></div>';
    html+='<div class="prog-wrap"><div class="prog-bar" style="width:'+Math.min(avg,100)+'%;background:'+ac+';"></div>';
    html+='<div class="prog-marker" style="left:86%;"></div></div>';
    html+='<div class="prog-foot"><span>'+ra.length+' stores &middot; '+passed+' passed ('+Math.round(passed/ra.length*100)+'%)</span><span style="color:'+ac+';font-weight:700;">'+gap+'</span></div>';
    html+='</div>';
  }

  html+='<div class="am-kpi"><div class="kpi-label">Area Manager REV Performance &mdash; '+CC+' 2026</div>';
  Object.keys(AMS).forEach(function(am){
    var amA=ra.filter(function(a){return a.am===am;});
    var total=AMS[am].length;
    if(!amA.length){
      html+='<div class="am-kpi-row"><div class="am-kpi-top"><div><div class="am-kpi-name">'+am+'</div>';
      html+='<div class="am-kpi-region">'+AMR[am]+' &middot; '+total+' stores</div></div>';
      html+='<div style="font-size:11px;color:rgba(255,255,255,0.3);">Not audited</div></div></div>';
      return;
    }
    var avg2=Math.round(amA.reduce(function(t,a){return t+a.rev_score;},0)/amA.length*10)/10;
    var pass2=amA.filter(function(a){return a.rev_score>=77;}).length;
    var pct2=Math.round(pass2/amA.length*100);
    var ac2=rc(avg2);
    html+='<div class="am-kpi-row"><div class="am-kpi-top"><div><div class="am-kpi-name">'+am+'</div>';
    html+='<div class="am-kpi-region">'+AMR[am]+' &middot; '+amA.length+'/'+total+' audited</div></div>';
    html+='<div style="text-align:right"><div class="am-kpi-score" style="color:'+ac2+';">'+avg2+'%</div>';
    html+='<div class="am-kpi-band" style="background:'+rbg(avg2)+';color:'+ac2+';">'+rb(avg2)+'</div></div></div>';
    html+='<div class="am-bar-bg"><div class="am-bar-fill" style="width:'+Math.min(avg2,100)+'%;background:'+ac2+';"></div></div>';
    html+='<div class="am-kpi-foot">'+pass2+'/'+amA.length+' stores pass ('+pct2+'%) &middot; Pass = 77%+</div></div>';
  });
  html+='</div>';

  document.getElementById('v-overview').innerHTML=html;
}

function renderByAM(){
  var html='';
  Object.keys(AMS).forEach(function(am){
    var stores=AMS[am];
    var amA=(AD.audits||[]).filter(function(a){return a.cycle===CC&&a.am===am&&a.rev_score!==null&&a.rev_score!==undefined;});
    var avg=amA.length?Math.round(amA.reduce(function(t,a){return t+a.rev_score;},0)/amA.length*10)/10:null;
    var ac=avg!==null?rc(avg):'#8E8E93';
    html+='<div class="am-section">';
    html+='<div class="am-hdr"><div class="am-hdr-name">'+am+' &middot; '+AMR[am]+'</div>';
    if(avg!==null) html+='<div class="am-hdr-avg" style="color:'+ac+';">'+avg+'%</div>';
    html+='</div>';
    stores.forEach(function(store){
      var a=ga(store);
      var rev=a?a.rev_score:null;
      var fs=a?a.fs_result:null;
      var dt=a?new Date(a.audit_date).toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'';
      html+='<div class="store-row">';
      html+='<div style="flex:1"><div class="store-name">'+sd(store)+'</div>';
      if(dt) html+='<div style="font-size:10px;color:var(--text2);">'+dt+'</div>';
      html+='</div>';
      if(rev!==null){
        var rcc=rc(rev);
        html+='<div style="text-align:right;margin-right:8px;">';
        html+='<div style="font-size:16px;font-weight:700;color:'+rcc+';">'+rev+'%</div>';
        html+='<div style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;background:'+rbg(rev)+';color:'+rcc+';">'+rb(rev)+'</div></div>';
      } else {
        html+='<span style="font-size:11px;color:var(--text2);margin-right:8px;">No REV</span>';
      }
      if(fs) html+='<span class="fs-pill '+(fs==='pass'?'fs-pass':'fs-fail')+'">'+(fs==='pass'?'FS Pass':'FS Fail')+'</span>';
      else html+='<span class="fs-pill fs-pend">FS --</span>';
      html+='</div>';
    });
    html+='</div>';
  });
  document.getElementById('v-byam').innerHTML=html||'<div class="empty">No audit data yet</div>';
}

function renderSubmissions(){
  var sorted=(AD.audits||[]).filter(function(a){return a.cycle===CC;}).sort(function(a,b){return new Date(b.submittedAt)-new Date(a.submittedAt);});
  if(!sorted.length){document.getElementById('v-submissions').innerHTML='<div class="empty">No submissions yet</div>';return;}
  var html='<div class="sub-table"><div class="sub-row sub-hdr-row"><div class="sub-hc" style="flex:1">Store</div><div class="sub-hc" style="min-width:60px">AM</div><div class="sub-hc" style="min-width:48px;text-align:right">REV</div><div class="sub-hc" style="min-width:44px;text-align:right">FS</div></div>';
  sorted.forEach(function(s){
    var rcc=s.rev_score!==null&&s.rev_score!==undefined?rc(s.rev_score):'#8E8E93';
    var rtx=s.rev_score!==null&&s.rev_score!==undefined?s.rev_score+'%':'--';
    var fc=s.fs_result==='pass'?'#34C759':s.fs_result==='fail'?'#FF3B30':'#8E8E93';
    var ftx=s.fs_result?s.fs_result.toUpperCase():'--';
    html+='<div class="sub-row"><div style="flex:1;font-size:12px;font-weight:600;">'+sd(s.store)+'</div>';
    html+='<div style="min-width:60px;font-size:11px;color:var(--text2);">'+s.am+'</div>';
    html+='<div style="min-width:48px;text-align:right;font-size:13px;font-weight:700;color:'+rcc+';">'+rtx+'</div>';
    html+='<div style="min-width:44px;text-align:right;font-size:11px;font-weight:700;color:'+fc+';">'+ftx+'</div></div>';
  });
  html+='</div>';
  document.getElementById('v-submissions').innerHTML=html;
}

function renderEntry(){
  var stores=AMS[CAM]||Object.keys(AMS).reduce(function(a,k){return a.concat(AMS[k]);}, []);
  var opts=stores.map(function(s){return '<option value="'+s+'">'+sd(s)+'</option>';}).join('');
  var html='<div class="entry-form"><div class="form-title">Submit Audit Score</div>';
  html+='<div class="form-row"><div class="form-lbl">Audit Type</div><div class="audit-type-row">';
  html+='<button class="type-opt selected" id="tRF" onclick="setAT(\'rev_fs\')">REV + FS</button>';
  html+='<button class="type-opt" id="tRO" onclick="setAT(\'rev\')">REV Only</button>';
  html+='<button class="type-opt" id="tFO" onclick="setAT(\'fs\')">FS Only</button></div></div>';
  html+='<div class="form-row"><div class="form-lbl">Store</div>';
  html+='<select class="form-input" id="aStore"><option value="">Select store...</option>'+opts+'</select></div>';
  html+='<div class="form-row" id="rRow"><div class="form-lbl">REV Score % &mdash; Pass 77%+ &mdash; Target 86%+</div>';
  html+='<input type="number" class="form-input" id="rScore" min="0" max="100" placeholder="e.g. 84"></div>';
  html+='<div class="form-row" id="fRow"><div class="form-lbl">Food Safety Result</div>';
  html+='<div class="fs-toggle"><button class="fs-opt" id="fPass" onclick="setFS(\'pass\')">PASS</button>';
  html+='<button class="fs-opt" id="fFail" onclick="setFS(\'fail\')">FAIL</button></div></div>';
  html+='<div class="form-row" id="fPct"><div class="form-lbl">FS Score %</div>';
  html+='<input type="number" class="form-input" id="fScore" min="0" max="100" placeholder="e.g. 91"></div>';
  html+='<div class="form-row"><div class="form-lbl">Audit Date</div>';
  html+='<input type="date" class="form-input" id="aDate" value="'+new Date().toISOString().split('T')[0]+'"></div>';
  html+='<div class="form-row"><div class="form-lbl">Auditor Name</div>';
  html+='<input type="text" class="form-input" id="aAuditor" placeholder="Auditor name"></div>';
  html+='<div class="form-row"><div class="form-lbl">Corrective Actions</div>';
  html+='<textarea class="form-input" id="aActions" rows="4" placeholder="1. Action item..."></textarea></div>';
  html+='<div style="background:rgba(255,149,0,0.08);border-radius:10px;padding:10px;margin-bottom:12px;font-size:11px;color:#B36200;">Pass = 77%+ &middot; Target = 86%+ &middot; Below 77% flagged to Jahid immediately</div>';
  html+='<button class="submit-btn" onclick="doSubmit()">Submit Audit Score</button></div>';
  html+='<div id="subMsg"></div>';
  document.getElementById('v-entry').innerHTML=html;
}

function setAT(t){
  ATS=t;
  ['tRF','tRO','tFO'].forEach(function(id,i){
    var el=document.getElementById(id);
    if(el) el.classList.toggle('selected',['rev_fs','rev','fs'][i]===t);
  });
  var rr=document.getElementById('rRow'),fr=document.getElementById('fRow'),fp=document.getElementById('fPct');
  if(rr) rr.style.display=t==='fs'?'none':'block';
  if(fr) fr.style.display=t==='rev'?'none':'block';
  if(fp) fp.style.display=t==='rev'?'none':'block';
}

function setFS(r){
  FSS=r;
  var p=document.getElementById('fPass'),f=document.getElementById('fFail');
  if(p) p.className='fs-opt'+(r==='pass'?' pass-sel':'');
  if(f) f.className='fs-opt'+(r==='fail'?' fail-sel':'');
}

function doSubmit(){
  var store=document.getElementById('aStore').value;
  var rev=ATS!=='fs'?parseFloat(document.getElementById('rScore').value)||null:null;
  var fsScr=ATS!=='rev'?parseFloat(document.getElementById('fScore').value)||null:null;
  var dt=document.getElementById('aDate').value;
  var aud=document.getElementById('aAuditor').value;
  var act=document.getElementById('aActions').value;
  if(!store){alert('Please select a store.');return;}
  if(ATS!=='fs'&&!rev){alert('Please enter the REV score.');return;}
  if(ATS!=='rev'&&!FSS){alert('Please select PASS or FAIL for Food Safety.');return;}
  var entry={store:store,am:CAM||'Unknown',cycle:CC,type:ATS,
    rev_score:rev,fs_result:ATS!=='rev'?FSS:null,fs_score:fsScr,
    audit_date:dt,auditor_name:aud,corrective_actions:act};
  var btn=document.querySelector('.submit-btn');
  btn.textContent='Submitting...'; btn.disabled=true;
  fetch('/api/audits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(entry)})
  .then(function(r){return r.json();}).then(function(d){
    if(d.success){
      var msg='<div style="background:rgba(52,199,89,0.1);border-radius:10px;padding:14px;text-align:center;margin-top:8px;">';
      msg+='<div style="font-size:16px;font-weight:700;color:#1B7A3A;">Submitted</div>';
      msg+='<div style="font-size:12px;color:var(--text2);margin-top:4px;">'+sd(store)+' &middot; '+CC+'</div></div>';
      if(rev!==null&&rev<77) msg+='<div style="background:rgba(255,59,48,0.08);border-radius:8px;padding:8px;margin-top:6px;font-size:11px;color:#C8102E;font-weight:600;">Below 77% &mdash; Jahid notified.</div>';
      document.getElementById('subMsg').innerHTML=msg;
      AD.audits.push(entry); renderAll();
      btn.textContent='Submit Another'; btn.disabled=false;
      btn.onclick=function(){renderEntry();sv('entry');};
    }
  }).catch(function(){btn.textContent='Submit Audit Score';btn.disabled=false;alert('Failed. Please try again.');});
}

load();
setInterval(load,60000);
</script>
</body>
</html>
