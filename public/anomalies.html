<link rel="stylesheet" href="styles.css"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;position:sticky;top:var(--nav-h);z-index:89;}
.back{color:var(--text2);text-decoration:none;font-size:13px;display:inline-flex;align-items:center;gap:6px;margin-bottom:3px;}
.back:hover{color:var(--red);}
.hdr-title{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-0.4px;}
.hdr-sub{font-size:12px;color:var(--text2);}
.content{padding:16px 20px 40px;}
.hero{background:linear-gradient(135deg,#1A0508,#C8102E);border-radius:18px;padding:20px;margin-bottom:14px;}
.hero-label{font-size:11px;color:rgba(255,255,255,0.6);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;}
.hero-num{font-size:48px;font-weight:700;color:#fff;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums;}
.hero-sub{font-size:13px;color:rgba(255,255,255,0.6);margin-top:6px;}
.hero-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;}
.hg{background:rgba(255,255,255,0.14);border-radius:10px;padding:10px;text-align:center;}
.hg-num{font-size:18px;font-weight:700;color:#fff;line-height:1;font-variant-numeric:tabular-nums;}
.hg-label{font-size:10px;color:rgba(255,255,255,0.6);margin-top:2px;text-transform:uppercase;letter-spacing:0.3px;}
.sfilter{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap;}
.sfbtn{padding:5px 14px;border-radius:18px;font-size:11px;font-weight:600;border:1.5px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.sfbtn.active{background:var(--red);border-color:var(--red);color:#fff;}
.anomaly{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:8px;box-shadow:0 1px 6px rgba(0,0,0,0.05);border-left:4px solid transparent;display:flex;gap:12px;align-items:flex-start;}
.anomaly.critical{border-left-color:#C8102E;}
.anomaly.warning{border-left-color:#FF9500;}
.anomaly.resolved{border-left-color:#34C759;opacity:0.6;}
.anomaly-icon{font-size:24px;flex-shrink:0;margin-top:2px;}
.anomaly-body{flex:1;min-width:0;}
.anomaly-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px;}
.anomaly-detail{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:6px;}
.anomaly-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;}
.badge-critical{background:#C8102E;color:#fff;}
.badge-warning{background:#FFF3CD;color:#856404;}
.badge-resolved{background:#D4EDDA;color:#1B7A3A;}
.badge-type{background:var(--surface);color:var(--text2);border:1px solid var(--border);}
.anomaly-time{font-size:10px;color:var(--text3);}
.btn-resolve{padding:6px 14px;border:none;border-radius:8px;background:#34C759;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;margin-top:2px;}
.btn-resolve:disabled{opacity:0.4;cursor:not-allowed;}
.btn-refresh{padding:8px 16px;border:none;border-radius:10px;background:var(--red);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.empty{text-align:center;padding:48px 20px;color:var(--text2);}
.empty span{font-size:40px;display:block;margin-bottom:10px;}
.spinner{width:24px;height:24px;border:2.5px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin 0.8s linear infinite;margin:40px auto;display:block;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.3s ease;}
#pin-wall{position:fixed;inset:0;z-index:var(--z-wall);background:#1A1A1A;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;}
.pin-logo{font-size:48px;margin-bottom:8px;}
.pin-title{font-size:24px;font-weight:800;color:#fff;margin-bottom:4px;letter-spacing:-0.5px;}
.pin-sub{font-size:13px;color:#6E6E73;margin-bottom:40px;}
.pin-dots{display:flex;gap:16px;margin-bottom:32px;}
.pin-dot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,0.15);transition:background-color 120ms ease-out;}
.pin-dot.filled{background:#C8102E;}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:240px;}
.pin-btn{height:64px;border-radius:16px;background:rgba(255,255,255,0.08);border:none;color:#fff;font-size:22px;font-weight:600;cursor:pointer;transition:background-color 120ms ease-out;}
.pin-btn:active{background:rgba(200,16,46,0.3);}
.pin-error{font-size:13px;color:#FF3B30;margin-top:16px;opacity:0;transition:opacity 120ms ease-out;}
.pin-error.show{opacity:1;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pin-dots.shake{animation:shake 0.3s ease;}
.top-actions{display:flex;gap:8px;margin-bottom:14px;}
@media(max-width:480px){.hero-grid{grid-template-columns:1fr 1fr;}.content{padding:12px 14px 32px;}}
</style>
</head>

      <svg id="themeIconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

<div id="pin-wall">
  <div class="pin-logo">&#x1F9E0;</div>
  <div class="pin-title">Anomaly Detection</div>
  <div class="pin-sub">Enter your PIN to continue</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-pad">
    <button class="pin-btn" onclick="pinPress('1')">1</button>
    <button class="pin-btn" onclick="pinPress('2')">2</button>
    <button class="pin-btn" onclick="pinPress('3')">3</button>
    <button class="pin-btn" onclick="pinPress('4')">4</button>
    <button class="pin-btn" onclick="pinPress('5')">5</button>
    <button class="pin-btn" onclick="pinPress('6')">6</button>
    <button class="pin-btn" onclick="pinPress('7')">7</button>
    <button class="pin-btn" onclick="pinPress('8')">8</button>
    <button class="pin-btn" onclick="pinPress('9')">9</button>
    <button class="pin-btn" onclick="pinPress('c')">Clear</button>
    <button class="pin-btn" onclick="pinPress('0')">0</button>
    <button class="pin-btn" onclick="pinPress('x')">&#x232B;</button>
  </div>
  <div class="pin-error" id="pinError">Incorrect PIN. Try again.</div>
</div>

<div class="page-content">
  <div class="hdr">
    <a href="index.html" class="back">&#x2190; Home</a>
    <div style="display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px;">
      <div>
        <div class="hdr-title">&#x1F9E0; Anomaly Detection</div>
        <div class="hdr-sub">Real-time operational alerts across all stores</div>
      </div>
      <button class="btn-refresh" onclick="refreshAnomalies()">&#x21BB; Scan</button>
    </div>
  </div>
  <div class="content" id="mainContent"><div class="spinner"></div></div>
</div>

<script>
var anomalies = [], typeFilter = 'all', authToken = '';

function loadAnomalies() {
  document.getElementById('mainContent').innerHTML = '<div class="spinner"></div>';
  fetch('/api/anomalies', { headers: { 'Authorization': 'Bearer ' + authToken } })
    .then(function(r) { return r.json(); })
    .then(function(d) { anomalies = d.data || []; render(); })
    .catch(function() { document.getElementById('mainContent').innerHTML = '<div class="empty"><span>&#x26A0;</span><p>Failed to load anomalies.</p></div>'; });
}

function refreshAnomalies() {
  var btn = event.target; btn.disabled = true; btn.textContent = 'Scanning...';
  fetch('/api/anomalies/refresh', { method: 'POST', headers: { 'Authorization': 'Bearer ' + authToken } })
    .then(function(r) { return r.json(); })
    .then(function() { loadAnomalies(); btn.disabled = false; btn.textContent = '\u21BB Scan'; })
    .catch(function() { btn.disabled = false; btn.textContent = '\u21BB Scan'; });
}

function render() {
  var open = anomalies.filter(function(a) { return !a.resolved; });
  var critical = open.filter(function(a) { return a.severity === 'critical'; });
  var warning = open.filter(function(a) { return a.severity === 'warning'; });

  var filtered = typeFilter === 'all' ? open
    : typeFilter === 'resolved' ? anomalies.filter(function(a) { return a.resolved; })
    : open.filter(function(a) { return a.type === typeFilter; });

  var html = '<div class="hero fade-in">'
    + '<div class="hero-label">Active Anomalies</div>'
    + '<div class="hero-num">' + open.length + '</div>'
    + '<div class="hero-sub">Detected across all stores</div>'
    + '<div class="hero-grid">'
    + '<div class="hg"><div class="hg-num" style="color:#FFD60A;">' + critical.length + '</div><div class="hg-label">Critical</div></div>'
    + '<div class="hg"><div class="hg-num">' + warning.length + '</div><div class="hg-label">Warning</div></div>'
    + '<div class="hg"><div class="hg-num" style="color:#34C759;">' + anomalies.filter(function(a){return a.resolved;}).length + '</div><div class="hg-label">Resolved</div></div>'
    + '</div></div>';

  html += '<div class="sfilter fade-in">'
    + sfBtn('all', 'All Open (' + open.length + ')')
    + sfBtn('score_drop', 'Score Drops')
    + sfBtn('no_submission', 'No Submission')
    + sfBtn('visit_gap', 'Visit Gaps')
    + sfBtn('fdu_streak', 'FDU Missing')
    + sfBtn('machine_broken', 'Equipment')
    + sfBtn('resolved', '\u2705 Resolved')
    + '</div>';

  if (filtered.length === 0) {
    html += '<div class="empty fade-in"><span>&#x2705;</span><p>No anomalies in this view.</p></div>';
  } else {
    filtered.forEach(function(a) { html += renderAnomaly(a); });
  }
  document.getElementById('mainContent').innerHTML = html;
}

function sfBtn(val, label) {
  var cls = 'sfbtn' + (typeFilter === val ? ' active' : '');
  return '<button class="' + cls + '" onclick="setTypeFilter(\'' + val + '\')">' + label + '</button>';
}
function setTypeFilter(f) { typeFilter = f; render(); }

function typeIcon(type) {
  var map = { score_drop:'\uD83D\uDCC9', no_submission:'\u270D\uFE0F', visit_gap:'\uD83D\uDC64', fdu_streak:'\uD83C\uDF69', machine_broken:'\uD83D\uDD27' };
  return map[type] || '\u26A0\uFE0F';
}

function typeLabel(type) {
  var map = { score_drop:'Score Drop', no_submission:'No Submission', visit_gap:'Visit Gap', fdu_streak:'FDU Missing', machine_broken:'Equipment' };
  return map[type] || type;
}

function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function renderAnomaly(a) {
  var sevClass = a.resolved ? 'resolved' : a.severity;
  var sevBadge = a.resolved
    ? '<span class="badge badge-resolved">\u2705 Resolved</span>'
    : '<span class="badge badge-' + a.severity + '">' + (a.severity === 'critical' ? '\u26A1 Critical' : '\u26A0 Warning') + '</span>';

  var resolveBtn = (!a.resolved && (userRole === 'maintenance' || userRole === 'hod' || userRole === 'ceo'))
    ? '<button class="btn-resolve" onclick="resolveAnomaly(\'' + a.id + '\')">Resolve</button>'
    : '';

  return '<div class="anomaly ' + sevClass + ' fade-in">'
    + '<div class="anomaly-icon">' + typeIcon(a.type) + '</div>'
    + '<div class="anomaly-body">'
    + '<div class="anomaly-title">' + a.title + '</div>'
    + '<div class="anomaly-detail">' + a.detail + '</div>'
    + '<div class="anomaly-meta">'
    + sevBadge
    + '<span class="badge badge-type">' + typeLabel(a.type) + '</span>'
    + '<span class="anomaly-time">' + fmtDate(a.detectedAt) + '</span>'
    + '</div></div>'
    + resolveBtn
    + '</div>';
}

function resolveAnomaly(id) {
  var btn = event.target; btn.disabled = true; btn.textContent = 'Done';
  fetch('/api/anomalies/' + id + '/resolve', {
    method: 'POST', headers: { 'Authorization': 'Bearer ' + authToken }
  }).then(function() { loadAnomalies(); });
}

var userRole = '';
</script>

<script>
(function() {
  var wall = document.getElementById('pin-wall');
  var stored = localStorage.getItem('th_anom_token');
  if (stored) {
    authToken = stored;
    userRole = localStorage.getItem('th_anom_role') || '';
    wall.style.display = 'none';
    loadAnomalies();
    return;
  }
  var entered = [];
  function pinPress(v) {
    if (v === 'c') { entered = []; renderDots(); return; }
    if (v === 'x') { entered.pop(); renderDots(); return; }
    if (entered.length >= 4) return;
    entered.push(v); renderDots();
    if (entered.length === 4) setTimeout(check, 100);
  }
  function renderDots() {
    for (var i = 0; i < 4; i++) {
      document.getElementById('d' + i).className = 'pin-dot' + (i < entered.length ? ' filled' : '');
    }
  }
  function check() {
    var pin = entered.join('');
    fetch('/api/auth/verify-pin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: pin }) })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (!d.success || (d.role !== 'hod' && d.role !== 'ceo' && d.role !== 'maintenance')) {
          wrong(); return;
        }
        authToken = d.token;
        userRole = d.role;
        localStorage.setItem('th_anom_token', d.token);
        localStorage.setItem('th_anom_role', d.role);
        wall.style.display = 'none';
        loadAnomalies();
      }).catch(function() { wrong(); });
  }
  function wrong() {
    entered = []; renderDots();
    var dots = document.getElementById('pinDots');
    var err = document.getElementById('pinError');
    dots.classList.add('shake'); err.classList.add('show');
    setTimeout(function() { dots.classList.remove('shake'); }, 400);
    setTimeout(function() { err.classList.remove('show'); }, 2000);
  }
  window.pinPress = pinPress;
})();
</script>
