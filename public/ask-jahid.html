<style>
:root{--red:#C8102E;--surface:#F2F2F7;--card:#fff;--border:#E5E5EA;--text:#1C1C1E;--text2:#8E8E93;--green:#34C759;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--surface);display:flex;flex-direction:column;}
.hdr{background:linear-gradient(135deg,#0D0D1A,#1A0508);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 14px;display:flex;align-items:center;gap:12px;flex-shrink:0;}

.av-wrap{width:42px;height:42px;border-radius:50%;border:2px solid rgba(200,16,46,0.6);overflow:hidden;flex-shrink:0;background:#C8102E;display:flex;align-items:center;justify-content:center;}

.msg.u{flex-direction:row-reverse;}

.bub{max-width:78%;padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word;}
.msg.b .bub{background:var(--card);color:var(--text);border-radius:4px 18px 18px 18px;box-shadow:0 1px 4px rgba(0,0,0,0.08);border:1px solid var(--border);}

.td{width:8px;height:8px;border-radius:50%;background:#aaa;animation:bounce 1.4s infinite;}
.td:nth-child(2){animation-delay:.2s;}.td:nth-child(3){animation-delay:.4s;}

.chip:active{background:var(--red);color:#fff;}
.inp-row{padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom,10px));background:var(--card);border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;flex-shrink:0;}

.send-btn{width:42px;height:42px;min-width:42px;border-radius:50%;background:var(--red);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}

<style id="pin-wall-css">

.pin-error.show{opacity:1;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pin-dots.shake{animation:shake 0.3s ease;}

var busy=false,conv=[],AM=localStorage.getItem("th_am_name")||"",INIT=AM?AM.split(" ").map(function(n){return n[0];}).join("").slice(0,2).toUpperCase():"AM";

function getFb(t){t=t.toLowerCase();if(t.indexOf("monday")>=0)return "Monday covers Financial and Inventory for ALL stores remotely.\n\n14 items: Petty cash, Banking, PO Snowmen and Jubilee, GRN, Safe tally, Spot audit, Cashier, Inventory.\n\nGo: Tasks then MON then select store then YES/NO/NA then Submit by midnight.\n\nNeed more help? Just ask!";if(t.indexOf("tuesday")>=0)return "Tuesday covers Sales Intelligence for ALL stores.\n\n5 sections:\n1. MTD Sales vs Target\n2. vs Last Year\n3. BF Combo UPD, Donuts, Timbits, Water, RTE per day\n4. Bev size mix\n5. Modifiers per day\n\nGo: Tasks then TUE then each store then Submit by midnight.\n\nNeed more help? Just ask!";if(t.indexOf("wednesday")>=0||t.indexOf("machine")>=0)return "Wednesday is on-site. Select the store you are visiting.\n\nSection 1: 9 machines - tap Working or Under Repair or Not Working for each.\nSection 2: 5 areas - tap Clean or Needs Attention or Critical.\nSection 3: 5 pest checks - tap Clear or Activity Found or Action Taken.\n\nYou must tap a status for each item before submitting.\n\nNeed more help? Just ask!";if(t.indexOf("friday")>=0)return "Friday on-site:\n1. CI Call 11am Yes or No\n2. Complaints count and category\n3. HOD support needed\n4. Weekend readiness: Stock, Manpower, Store\n5. Landlord meeting this month\n\nNeed more help? Just ask!";if(t.indexOf("saturday")>=0||t.indexOf("sunday")>=0)return "Sat and Sun 12 items:\n1-4: ACEs, Best cashier, POS display, LTO display\n5-7: Speed checks mm:ss target under 3 mins\n8-12: Frosted glasses, Ceramic cups, Club Apparel, QR feedback, NPS\n\nNeed more help? Just ask!";if(t.indexOf("ads")>=0||t.indexOf("adt")>=0||t.indexOf("apc")>=0||t.indexOf("upd")>=0||t.indexOf("glossary")>=0)return "Key terms:\nADS = Average Daily Sales\nADT = Average Daily Transactions\nAPC = Average Per Check\nUPD = Units Per Day\nLFL = Like-for-Like vs Last Year\nRTE = Ready to Eat\nLTO = Limited Time Offer\nBF Combo = Breakfast Combo Rs 245\nQR = Customer Feedback Tracking\nCA = Club Apparel Loyalty\n\nNeed more help? Just ask!";if(t.indexOf("score")>=0||t.indexOf("calculat")>=0)return "Score = YES divided by applicable items x 100\nYES = 1 point, NO = 0 flagged, NA = excluded\n\n90-100% Excellent\n75-89% Good\n60-74% Needs Attention\nBelow 60% Critical\n\nNeed more help? Just ask!";if(t.indexOf("april")>=0||t.indexOf("target")>=0)return "April 2026 targets:\nStores ADS above Rs 60K: March x1.09\nSub Rs 60K stores: March x1.05\n\nTop targets:\nT1D Dial Rs 4.38L per day\nHIAL Rs 2.17L per day\nCyberhub Rs 1.82L per day\n\nSee all: Scores then KPI Dashboard then Outlook.\n\nNeed more help? Just ask!";if(t.indexOf("issue")>=0||t.indexOf("bug")>=0||t.indexOf("not working")>=0||t.indexOf("report")>=0){setTimeout(showForm,300);return "I will escalate to Jahid right away. Please fill in the details below.";}return "I can help with:\n- Any checklist Mon Tue Wed Fri Sat Sun\n- KPI terms ADS ADT APC UPD\n- Score calculations\n- Navigation help\n- Reporting issues to Jahid\n\nTap a button or type your question.\n\nNeed more help? Just ask!";}
function doSend(txt){if(busy)return;addUsr(txt);busy=true;var sb=document.getElementById("sb");if(sb)sb.disabled=true;conv.push({role:"user",content:txt});showTy();fetch("/api/ask-jahid/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:txt,am:AM,history:conv.slice(-6)})}).then(function(r){return r.json();}).then(function(d){rmTy();busy=false;if(sb)sb.disabled=false;var r=d.reply||"Please try again.";conv.push({role:"assistant",content:r});addBot(r);var iw=["bug","issue","error","not working","broken","problem","unable","failed"];if(iw.some(function(w){return txt.toLowerCase().indexOf(w)>=0;}))setTimeout(showForm,600);}).catch(function(){rmTy();busy=false;if(sb)sb.disabled=false;addBot(getFb(txt));});}
var STORES="<option value=''>Select store</option><optgroup label='Punjab'><option>TH Malhar Road</option><option>TH Sunview Enclave</option><option>TH Bucho Bathinda</option><option>TH Patiala</option><option>TH Mohali</option><option>TH Sangrur</option><option>TH Elante Mall</option><option>TH Sec 35 Chandigarh</option></optgroup><optgroup label='Delhi NCR'><option>TH DLF Cyberhub</option><option>TH Golf Course AIPL</option><option>TH Select City Saket</option><option>TH Green Park</option><option>TH Punjabi bagh</option><option>TH Vegas Mall</option><option>TH NSP Pritampura</option><option>TH Basant Lok</option><option>TH Epicuria Nehru Place</option><option>TH T1D Dial</option><option>TH T3D Food Court</option><option>TH T3D DIAL</option><option>TH Skymark one</option></optgroup><optgroup label='Gujarat'><option>TH T1 Ahmedabad Airport</option><option>TH Sindhu Bhavan</option><option>TH Navrangpura</option></optgroup><optgroup label='Maharashtra'><option>TH Lokhandwala</option><option>TH MC Kurla</option><option>TH Bandra</option><option>TH Balewadi Pune</option><option>TH FIFC Mumbai</option><option>TH HPCL Mumbai Pune Expressway</option><option>TH Viman Nagar</option><option>TH Phonix Mall Wakad</option><option>TH Nexus Seawood</option><option>TH FC Road</option><option>TH NMIA Arrival</option><option>TH NMiA Departure</option></optgroup><optgroup label='Karnataka'><option>TH BIAL</option><option>TH Mall of Asia</option><option>TH Koramangala</option><option>TH HSR</option></optgroup><optgroup label='Telangana'><option>TH Inorbit Mall-Hyderabad</option><option>TH HIAL</option><option>TH HIAL Arrival</option><option>TH Lakeshore</option></optgroup>";
function showForm(){if(document.getElementById("iform"))return;var d=document.createElement("div");d.className="msg b";d.id="iform";var av=mkAv();var bub=document.createElement("div");bub.className="bub";var box=document.createElement("div");box.className="ibox";var lbl=document.createElement("div");lbl.className="ilbl";lbl.textContent="Report to Jahid";var in1=document.createElement("input");in1.id="i-n";in1.placeholder="Your name";in1.value=AM;var sel=document.createElement("select");sel.id="i-s";sel.innerHTML=STORES;var ta=document.createElement("textarea");ta.id="i-d";ta.rows=3;ta.placeholder="Describe the issue...";var btn=document.createElement("button");btn.textContent="Send to Jahid Now";btn.onclick=subForm;box.appendChild(lbl);box.appendChild(in1);box.appendChild(sel);box.appendChild(ta);box.appendChild(btn);bub.appendChild(box);var w=document.createElement("div");w.appendChild(bub);d.appendChild(av);d.appendChild(w);document.getElementById("msgs").appendChild(d);scrl();}
function subForm(){var n=document.getElementById("i-n").value.trim();var s=document.getElementById("i-s").value;var desc=document.getElementById("i-d").value.trim();if(!n||!desc){alert("Please enter your name and describe the issue.");return;}document.getElementById("iform").remove();fetch("/api/ask-jahid/issue",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,store:s,description:desc})}).then(function(){addBot("Sent to Jahid and Sandeep.\n"+n+(s?" at "+s:"")+"\n"+desc+"\nJahid will respond shortly.");}).catch(function(){addBot("Issue noted. Contact Jahid if urgent.");});}
var chips=document.getElementById("chips");
var cd=[["Monday","How do I fill the Monday checklist?"],["Tuesday","How do I fill the Tuesday checklist?"],["Glossary","What is ADS ADT APC and UPD?"],["My Score","How is my score calculated?"],["Report Issue","I have a technical issue to report"],["April Targets","What are my April 2026 targets?"]];

addBot("Hi "+(AM||"there")+"! I am Jahid, your guide for Tims Ops Connect.\n\nI can help with:\n- How to fill any checklist\n- KPI terms and score calculations\n- Navigation help\n- Technical issues escalated to Jahid immediately\n\nTap a button or type below.");

<script id="pin-wall-js">
(function(){
  var PINS={'am':'2026','hod':'2202'};
  var wall=document.getElementById('pin-wall');
  var isHODPage=window.location.pathname.indexOf('hod')>-1;
  var pinOK=localStorage.getItem('th_pin_ok')==='1';
  var hodOK=localStorage.getItem('th_hod_ok')==='1';
  if(pinOK&&(!isHODPage||hodOK)){wall.style.display='none';return;}
  var entered=[];
  function pinPress(v){
    if(v==='c'){entered=[];render();return;}
    if(v==='x'){entered.pop();render();return;}
    if(entered.length>=4) return;
    entered.push(v);
    render();
    if(entered.length===4){
      setTimeout(function(){check();},100);
    }
  }
  function render(){
    for(var i=0;i<4;i++){
      document.getElementById('d'+i).className='pin-dot'+(i<entered.length?' filled':'');
    }
  }
  function check(){
    var pin=entered.join('');
    if(pin===PINS.hod){
      localStorage.setItem('th_pin_ok','1');
      localStorage.setItem('th_hod_ok','1');
      localStorage.setItem('th_is_hod','1');
      wall.style.display='none';
    }else if(pin===PINS.am&&!isHODPage){
      localStorage.setItem('th_pin_ok','1');
      wall.style.display='none';
    }else{
      wrong();
    }
  }
  function wrong(){
    entered=[];
    render();
    var dots=document.getElementById('pinDots');
    var err=document.getElementById('pinError');
    dots.classList.add('shake');
    err.classList.add('show');
    setTimeout(function(){dots.classList.remove('shake');},400);
    setTimeout(function(){err.classList.remove('show');},2000);
  }
  window.pinPress=pinPress;
})();
</script>
