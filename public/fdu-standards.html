<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FDU Standards — OpsAIHub</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="timsy.css">
<style>
/* Hallmark · macrostructure: Command-Centre · genre: modern-minimal · theme: custom (brand-locked) */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--surface); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; padding-bottom: 60px; }

.topbar { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.topbar-back { font-size: 22px; color: var(--text2); background: none; border: none; cursor: pointer; padding: 2px; }
.topbar-title { font-size: 17px; font-weight: 700; color: var(--text); flex: 1; }
.topbar-save { padding: 8px 20px; background: var(--red); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background-color 150ms ease-out; }
.topbar-save:hover { background: var(--red-dark); }
.topbar-save:disabled { background: var(--border); color: var(--text3); cursor: not-allowed; }

.page-body { max-width: 720px; margin: 0 auto; padding: 20px 16px; }

.section-head { font-size: 13px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; margin: 24px 0 10px; }
.section-head:first-child { margin-top: 0; }

/* FDU size card */
.size-panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 560px) { .size-panels { grid-template-columns: 1fr; } }

.size-panel { background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; overflow: hidden; }
.size-panel-head { padding: 12px 14px 10px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.size-label { font-size: 15px; font-weight: 700; color: var(--text); flex: 1; }
.size-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
.badge-3ft { background: rgba(255,149,0,0.12); color: #C07700; }
.badge-5ft { background: rgba(0,122,255,0.10); color: #0066D6; }
.badge-7ft { background: rgba(52,199,89,0.10); color: #1A8A3A; }

/* Visual FDU diagram */
.fdu-diagram { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.fdu-shelf { display: flex; flex-direction: column; gap: 4px; }
.shelf-label { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
.shelf-baskets { display: flex; gap: 3px; flex-wrap: wrap; }
.basket { border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #fff; height: 28px; flex: 1; min-width: 20px; }
.basket-dream   { background: linear-gradient(135deg, #C8102E, #E8344A); }
.basket-classic { background: linear-gradient(135deg, #FF9500, #FFAA33); }
.basket-timbits { background: linear-gradient(135deg, #34C759, #4DD96E); }
.basket-count   { font-size: 8px; opacity: 0.9; }

.shelf-divider { height: 3px; background: linear-gradient(90deg, var(--border), transparent); border-radius: 2px; margin: 2px 0; }

/* Shelf editor */
.shelf-editor { border-top: 1px solid var(--border); }
.shelf-row { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--divider); }
.shelf-row:last-child { border-bottom: none; }
.shelf-row-name { font-size: 12px; font-weight: 600; color: var(--text2); flex: 1; }
.shelf-inputs { display: flex; gap: 6px; align-items: center; }
.shelf-input-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.shelf-input-lbl { font-size: 9px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
.shelf-num { width: 48px; padding: 5px 6px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; font-weight: 700; color: var(--text); text-align: center; background: var(--surface); outline: none; }
.shelf-num:focus { border-color: var(--red); }

/* Store assignment table */
.store-table { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.store-row { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--divider); gap: 10px; }
.store-row:last-child { border-bottom: none; }
.store-row-name { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }
.store-row-am { font-size: 11px; color: var(--text3); font-weight: 500; }
.size-radio-group { display: flex; gap: 4px; }
.size-radio { display: none; }
.size-radio-lbl { padding: 5px 10px; border-radius: 8px; border: 1.5px solid var(--border); font-size: 11px; font-weight: 600; color: var(--text3); cursor: pointer; transition: background-color 120ms ease-out, border-color 120ms ease-out, color 120ms ease-out; white-space: nowrap; }
.size-radio:checked + .size-radio-lbl { border-color: var(--red); background: var(--red-tint); color: var(--red); }

.store-filter { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.filter-chip { padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--card); font-size: 11px; font-weight: 600; color: var(--text2); cursor: pointer; transition: border-color 120ms ease-out, background-color 120ms ease-out, color 120ms ease-out; }
.filter-chip.active { border-color: var(--red); background: var(--red-tint); color: var(--red); }

/* Timbit variants */
.timbit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.timbit-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; padding: 12px; }
.timbit-num { font-size: 11px; font-weight: 700; color: var(--text3); margin-bottom: 4px; }
.timbit-input { width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13px; font-weight: 600; color: var(--text); background: var(--surface); outline: none; font-family: inherit; }
.timbit-input:focus { border-color: var(--red); }

/* Donut variants table */
.donut-table { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.donut-row { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--divider); }
.donut-row:last-child { border-bottom: none; }
.donut-num { font-size: 12px; font-weight: 700; color: var(--text3); text-align: center; }
.donut-name-input { border: 1.5px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; color: var(--text); background: var(--surface); outline: none; font-family: inherit; width: 100%; }
.donut-name-input:focus { border-color: var(--red); }
.donut-row-select { border: 1.5px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 11px; font-weight: 600; color: var(--text2); background: var(--surface); outline: none; cursor: pointer; }
.donut-row-select:focus { border-color: var(--red); }
.row-tag { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
.row-dream   { background: rgba(200,16,46,0.10); color: var(--red); }
.row-classic { background: rgba(255,149,0,0.12); color: #C07700; }

.toast-msg { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #1D1D1F; color: #fff; font-size: 13px; font-weight: 600; padding: 10px 20px; border-radius: 20px; z-index: 500; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 200ms ease-out; }
.toast-msg.show { opacity: 1; }

.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--text2); }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; }
.legend-dream { background: linear-gradient(135deg, #C8102E, #E8344A); }
.legend-classic { background: linear-gradient(135deg, #FF9500, #FFAA33); }
.legend-timbits { background: linear-gradient(135deg, #34C759, #4DD96E); }
</style>
</head>
<body>

<div class="topbar">
  <button class="topbar-back" onclick="history.back()">‹</button>
  <span class="topbar-title">FDU Standards</span>
  <button class="topbar-save" id="saveBtn" onclick="saveAll()">Save Changes</button>
</div>

<div class="page-body">

  <!-- FDU SIZE LAYOUTS -->
  <div class="section-head">FDU Shelf Layout by Size</div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot legend-dream"></div> Dream Donuts (Top)</div>
    <div class="legend-item"><div class="legend-dot legend-classic"></div> Classic Donuts (Middle)</div>
    <div class="legend-item"><div class="legend-dot legend-timbits"></div> Tim Bits (Bottom)</div>
  </div>

  <div class="size-panels" id="sizePanels"></div>

  <!-- TIM BITS VARIANTS -->
  <div class="section-head">Tim Bits Variants — Bottom Shelf (4 variants)</div>
  <div class="timbit-grid" id="timbitGrid"></div>

  <!-- DONUT VARIANTS -->
  <div class="section-head">Donut Variants — 10 Active Variants</div>
  <div class="donut-table" id="donutTable"></div>

  <!-- STORE ASSIGNMENT -->
  <div class="section-head">Store FDU Size Assignment</div>
  <div class="store-filter">
    <div class="filter-chip active" data-filter="all" onclick="filterStores('all',this)">All Stores</div>
    <div class="filter-chip" data-filter="3ft" onclick="filterStores('3ft',this)">3ft FDU</div>
    <div class="filter-chip" data-filter="5ft" onclick="filterStores('5ft',this)">5ft FDU</div>
    <div class="filter-chip" data-filter="7ft" onclick="filterStores('7ft',this)">7ft FDU</div>
  </div>
  <div class="store-table" id="storeTable"></div>

</div>

<div class="toast-msg" id="toastMsg"></div>

<script>
var standards = null;
var allStores = [];
var currentFilter = 'all';

/* ── LOAD ── */
Promise.all([
  fetch('/api/fdu/standards').then(function(r){ return r.json(); }),
  fetch('/api/fdu/links').then(function(r){ return r.json(); }),
  fetch('/api/fdu/donut-sop').then(function(r){ return r.json(); })
]).then(function(results) {
  standards = results[0].standards || {};
  allStores = results[1].data || [];
  var sop = results[2];

  if (!standards.storeSizes)    standards.storeSizes    = {};
  if (!standards.layouts)       standards.layouts       = { '3ft': defaultLayout('3ft'), '5ft': defaultLayout('5ft'), '7ft': defaultLayout('7ft') };
  if (!standards.timbitVariants) standards.timbitVariants = defaultTimbits();

  renderSizePanels();
  renderTimbits();
  renderDonutTable(sop);
  renderStoreTable();
}).catch(function(err) {
  showToast('Failed to load standards');
  console.error(err);
});

function defaultLayout(size) {
  var b = size === '3ft' ? 4 : size === '7ft' ? 8 : 6;
  return {
    label: size + ' FDU',
    shelves: [
      { id: 'top',    name: 'Top Row — Dream Donuts',    type: 'dream',    baskets: b, minPerBasket: 3 },
      { id: 'middle', name: 'Middle Row — Classic Donuts', type: 'classic', baskets: b, minPerBasket: 3 },
      { id: 'bottom', name: 'Bottom Row — Tim Bits',      type: 'timbits', baskets: 4, minPerBasket: 10 }
    ]
  };
}

function defaultTimbits() {
  return [
    { id: 'glazed',        name: 'Original Glazed Timbit' },
    { id: 'chocolate',     name: 'Chocolate Timbit' },
    { id: 'blueberry',     name: 'Blueberry Timbit' },
    { id: 'birthday-cake', name: 'Birthday Cake Timbit' }
  ];
}

/* ── SIZE PANELS ── */
function renderSizePanels() {
  var sizes = ['3ft', '5ft', '7ft'];
  var badgeClass = { '3ft': 'badge-3ft', '5ft': 'badge-5ft', '7ft': 'badge-7ft' };
  document.getElementById('sizePanels').innerHTML = sizes.map(function(size) {
    var layout = standards.layouts[size] || defaultLayout(size);
    if (!layout.shelves) layout.shelves = defaultLayout(size).shelves;
    return '<div class="size-panel">' +
      '<div class="size-panel-head">' +
        '<span class="size-label">' + size + ' FDU</span>' +
        '<span class="size-badge ' + badgeClass[size] + '">' + size + '</span>' +
      '</div>' +
      '<div class="fdu-diagram">' + renderDiagram(layout, size) + '</div>' +
      '<div class="shelf-editor">' + renderEditor(layout, size) + '</div>' +
    '</div>';
  }).join('');
}

function renderDiagram(layout, size) {
  return layout.shelves.map(function(shelf) {
    var cls = 'basket-' + shelf.type;
    var baskets = '';
    for (var i = 0; i < shelf.baskets; i++) {
      baskets += '<div class="basket ' + cls + '"><span class="basket-count">' + shelf.minPerBasket + '</span></div>';
    }
    return '<div class="fdu-shelf">' +
      '<div class="shelf-label">' + (shelf.type === 'dream' ? '🍩 Dream' : shelf.type === 'classic' ? '🍩 Classic' : '⚪ Tim Bits') + '</div>' +
      '<div class="shelf-baskets">' + baskets + '</div>' +
    '</div>' + (shelf.id !== 'bottom' ? '<div class="shelf-divider"></div>' : '');
  }).join('');
}

function renderEditor(layout, size) {
  return layout.shelves.map(function(shelf, idx) {
    var basketId = 'baskets-' + size + '-' + shelf.id;
    var minId    = 'min-' + size + '-' + shelf.id;
    return '<div class="shelf-row">' +
      '<div class="shelf-row-name">' + (shelf.id === 'top' ? '🔴 Dream' : shelf.id === 'middle' ? '🟠 Classic' : '🟢 Tim Bits') + '</div>' +
      '<div class="shelf-inputs">' +
        '<div class="shelf-input-wrap">' +
          '<div class="shelf-input-lbl">Baskets</div>' +
          '<input class="shelf-num" type="number" id="' + basketId + '" value="' + shelf.baskets + '" min="1" max="20" onchange="updateLayout(\'' + size + '\',\'' + shelf.id + '\',\'baskets\',this.value)">' +
        '</div>' +
        '<div class="shelf-input-wrap">' +
          '<div class="shelf-input-lbl">Min ea.</div>' +
          '<input class="shelf-num" type="number" id="' + minId + '" value="' + shelf.minPerBasket + '" min="1" max="50" onchange="updateLayout(\'' + size + '\',\'' + shelf.id + '\',\'minPerBasket\',this.value)">' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function updateLayout(size, shelfId, field, val) {
  val = parseInt(val, 10);
  if (isNaN(val) || val < 1) return;
  var layout = standards.layouts[size];
  var shelf = layout.shelves.find(function(s){ return s.id === shelfId; });
  if (shelf) {
    shelf[field] = val;
    renderSizePanels();
  }
}

/* ── TIM BITS ── */
function renderTimbits() {
  var tv = standards.timbitVariants || defaultTimbits();
  document.getElementById('timbitGrid').innerHTML = tv.map(function(t, i) {
    return '<div class="timbit-card">' +
      '<div class="timbit-num">Variant ' + (i + 1) + '</div>' +
      '<input class="timbit-input" value="' + escHtml(t.name) + '" onchange="updateTimbit(' + i + ',this.value)" placeholder="Timbit name">' +
    '</div>';
  }).join('');
}

function updateTimbit(idx, val) {
  var tv = standards.timbitVariants || defaultTimbits();
  if (tv[idx]) tv[idx].name = val.trim();
  standards.timbitVariants = tv;
}

/* ── DONUT TABLE (read from donut-sop, editable names in standards) ── */
function renderDonutTable(sop) {
  var donuts = (sop.donuts || []).filter(function(d){ return !d.discontinued; });
  var html = donuts.map(function(d, i) {
    var rowType = (d.type === 'Classic Ring' || d.type === 'Filled Ring') ? 'classic' :
                  (d.type === 'Dream' || d.type === 'Filled') ? 'dream' : 'classic';
    return '<div class="donut-row">' +
      '<div class="donut-num">' + (i + 1) + '</div>' +
      '<input class="donut-name-input" value="' + escHtml(d.name) + '" readonly title="Edit in donut SOP system">' +
      '<span class="row-tag row-' + rowType + '">' + (rowType === 'dream' ? 'Top' : 'Middle') + '</span>' +
    '</div>';
  }).join('');
  document.getElementById('donutTable').innerHTML = html;
}

/* ── STORE TABLE ── */
function renderStoreTable() {
  var rows = allStores.map(function(s) {
    var size = (standards.storeSizes || {})[s.store] || '5ft';
    if (currentFilter !== 'all' && size !== currentFilter) return '';
    return '<div class="store-row" data-size="' + size + '">' +
      '<div style="flex:1;">' +
        '<div class="store-row-name">' + escHtml(s.store) + '</div>' +
        '<div class="store-row-am">' + escHtml(s.am) + '</div>' +
      '</div>' +
      '<div class="size-radio-group">' +
        ['3ft','5ft','7ft'].map(function(sz) {
          var uid = 'sz-' + s.token + '-' + sz;
          return '<input type="radio" class="size-radio" id="' + uid + '" name="sz-' + s.token + '" value="' + sz + '"' + (size === sz ? ' checked' : '') + ' onchange="updateStoreSize(\'' + s.store + '\',\'' + sz + '\')">' +
            '<label class="size-radio-lbl" for="' + uid + '">' + sz + '</label>';
        }).join('') +
      '</div>' +
    '</div>';
  }).join('');
  document.getElementById('storeTable').innerHTML = rows || '<div style="padding:20px;text-align:center;color:var(--text3)">No stores in this category</div>';
}

function filterStores(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('.filter-chip').forEach(function(c){ c.classList.remove('active'); });
  el.classList.add('active');
  renderStoreTable();
}

function updateStoreSize(store, size) {
  if (!standards.storeSizes) standards.storeSizes = {};
  standards.storeSizes[store] = size;
}

/* ── SAVE ── */
function saveAll() {
  var btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  fetch('/api/fdu/standards', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(standards)
  }).then(function(r){ return r.json(); }).then(function(d) {
    if (d.success) { showToast('FDU standards saved ✓'); }
    else { showToast('Save failed'); }
    btn.disabled = false;
    btn.textContent = 'Save Changes';
    renderSizePanels();
  }).catch(function() {
    showToast('Save failed');
    btn.disabled = false;
    btn.textContent = 'Save Changes';
  });
}

function showToast(msg) {
  var el = document.getElementById('toastMsg');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2800);
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
